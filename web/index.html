<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kinect v2 · point cloud</title>
<style>
  :root {
    --ink: #e8ecf1;
    --dim: #7d8794;
    --line: rgba(255, 255, 255, 0.1);
    --accent: #5ad1c4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #05070a; color: var(--ink);
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
  canvas { display: block; }

  #panel {
    position: fixed; top: 16px; left: 16px; width: 250px; max-height: calc(100vh - 32px);
    overflow-y: auto; padding: 14px; border: 1px solid var(--line); border-radius: 10px;
    background: rgba(8, 11, 16, 0.82); backdrop-filter: blur(12px); z-index: 10;
  }
  #panel h1 { margin: 0 0 2px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
  #status { color: var(--dim); margin-bottom: 12px; }
  #status b { color: var(--accent); font-weight: 500; }

  .group { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
  .group > label { display: block; color: var(--dim); margin-bottom: 6px;
    letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; }

  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .row span { flex: 0 0 74px; color: var(--dim); }
  .row output { flex: 0 0 42px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 3px; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .modes button {
    padding: 5px 4px; border: 1px solid var(--line); border-radius: 5px; cursor: pointer;
    background: transparent; color: var(--dim); font: inherit; font-size: 10px;
  }
  .modes button:hover { border-color: rgba(255,255,255,0.28); color: var(--ink); }
  .modes button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #04231f; }

  .check { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; cursor: pointer; }
  .check input { accent-color: var(--accent); margin: 0; }

  #hint { position: fixed; bottom: 14px; left: 16px; color: var(--dim); z-index: 10; }
</style>
</head>
<body>
  <div id="panel">
    <h1>Kinect v2</h1>
    <div id="status">connecting…</div>

    <div class="group">
      <label>Shading</label>
      <div class="modes" id="modes">
        <button data-mode="0" aria-pressed="true">RGB</button>
        <button data-mode="1" aria-pressed="false">Depth</button>
        <button data-mode="2" aria-pressed="false">Ghost</button>
        <button data-mode="3" aria-pressed="false">Contour</button>
      </div>
    </div>

    <div class="group">
      <label>Points</label>
      <div class="row"><span>size</span><input id="pointSize" type="range" min="0.5" max="14" step="0.1" value="4"><output>4</output></div>
      <div class="row"><span>opacity</span><input id="opacity" type="range" min="0.05" max="1" step="0.01" value="1"><output>1</output></div>
      <div class="row"><span>brightness</span><input id="exposure" type="range" min="0.2" max="3" step="0.05" value="1.15"><output>1.15</output></div>
    </div>

    <div class="group">
      <label>Depth clip (metres)</label>
      <div class="row"><span>near</span><input id="near" type="range" min="0.4" max="8" step="0.05" value="0.5"><output>0.5</output></div>
      <div class="row"><span>far</span><input id="far" type="range" min="0.4" max="8" step="0.05" value="4.5"><output>4.5</output></div>
    </div>

    <div class="group">
      <label>Motion</label>
      <div class="row"><span>turbulence</span><input id="warp" type="range" min="0" max="0.25" step="0.002" value="0"><output>0</output></div>
      <div class="row"><span>speed</span><input id="warpSpeed" type="range" min="0" max="3" step="0.05" value="0.7"><output>0.7</output></div>
      <label class="check"><input id="spin" type="checkbox"> auto-orbit</label>
    </div>

    <div class="group">
      <label>Cleanup</label>
      <label class="check"><input id="denoise" type="checkbox" checked> cull speckle</label>
      <div class="row"><span>edge tol</span><input id="edgeTol" type="range" min="10" max="400" step="5" value="120"><output>120</output></div>
    </div>
  </div>

  <div id="hint">drag to orbit · scroll to zoom · right-drag to pan · <b>H</b> hides panel</div>

  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
