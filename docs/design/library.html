<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Study 02 · Library</title>
<link rel="stylesheet" href="tokens.css" />
<style>
/* Hallmark · surface: library / gallery, skimmable
 * tone: technical-austere · genre: atmospheric · anchor hue: teal 182
 * page apparatus skipped: no nav, no footer, no hero — this is instrument chrome
 * runs on both devices: the Pi's 800x480 panel and the Mac. Skimming is a
 * pointer affordance, so every action it exposes is also reachable by tap.
 * pre-emit critique: P5 H5 E5 S5 R4 V5
 */

* { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0;
  background: var(--color-paper); color: var(--color-ink);
  font: var(--text-base)/1.4 var(--font-ui);
  overflow-x: clip;
}
body { display: flex; flex-direction: column; }

/* ── header ───────────────────────────────────────────────────────────────── */
.head {
  flex: none; display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
  padding: var(--space-2) var(--space-3);
  background: var(--color-paper-1);
  border-bottom: var(--rule) solid var(--color-line);
}
.head h1 { margin: 0; font-size: var(--text-md); font-weight: 600; letter-spacing: var(--track-label); text-transform: uppercase; }
.head .sum { color: var(--color-dim); font-size: var(--text-2xs); font-variant-numeric: tabular-nums; }
.head .sum b { color: var(--color-ink); font-weight: 500; }

/* Which machine you are on. The library spans both, so "here" has to be named
   or the local/node column is unreadable. */
.where {
  margin-left: auto; display: flex; align-items: center; gap: var(--space-2);
  font-size: var(--text-2xs); color: var(--color-dim); white-space: nowrap;
}
.where b { color: var(--color-ink); font-weight: 500; }
.where .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent); }

.tabs { flex: none; display: flex; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--color-paper-1); flex-wrap: wrap; }
.tab {
  appearance: none; -webkit-appearance: none;
  height: 32px; padding: 0 var(--space-3);
  border: var(--rule) solid var(--color-line); border-radius: var(--radius-sm);
  background: transparent; color: var(--color-dim);
  font: var(--text-2xs)/1 var(--font-ui); letter-spacing: var(--track-label); text-transform: uppercase;
  cursor: pointer; white-space: nowrap; touch-action: manipulation;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.tab:hover, .tab.is-hover { color: var(--color-ink); border-color: var(--color-line-2); }
.tab:focus-visible, .tab.is-focus { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.tab:active, .tab.is-active { background: var(--color-paper-2); }
.tab[aria-pressed="true"] { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-on-accent); }

/* ── gallery ──────────────────────────────────────────────────────────────── */
.grid {
  flex: 1; min-height: 0; overflow-y: auto;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
  gap: var(--space-3); padding: var(--space-3);
  align-content: start; align-items: start;
}

/* No overflow:hidden here, deliberately. It makes the tile a scroll container,
   and a scroll container's intrinsic height excludes its overflowing content -
   so the grid sized its rows from the definite parts alone, came out 73px short
   and the rows overlapped. The rounded top corners are clipped on .skim, which
   has a definite height and is the only child that needs clipping. */
.tile {
  border: var(--rule) solid var(--color-line); border-radius: var(--radius-md);
  background: var(--color-paper-1);
  display: flex; flex-direction: column;
  transition: border-color var(--dur-fast) var(--ease-out);
}
.tile:hover, .tile.is-hover { border-color: var(--color-line-2); }
.tile:focus-within { border-color: var(--color-line-3); }

/* Skim surface. Pointer events, so moving across it with a mouse and dragging
   across it with a finger are the same code path. */
/* The canvas stays in flow and JS gives it a definite pixel height. Deriving the
   height from aspect-ratio instead leaves the tile with no reliable intrinsic
   height - an absolutely positioned canvas contributes nothing - and the grid
   then sizes its row shorter than the tile and the rows overlap.
   16:9 rather than the sensor's 512x424 because the poster should preview the
   frame the export actually produces. */
.skim { position: relative; flex: none; overflow: hidden; border-radius: var(--radius-md) var(--radius-md) 0 0; background: var(--color-well); cursor: ew-resize; touch-action: pan-y; }
.skim canvas { display: block; width: 100%; }
.skim .t {
  position: absolute; top: 6px; right: 7px;
  font-size: var(--text-2xs); color: var(--color-dim);
  font-variant-numeric: tabular-nums; pointer-events: none;
  background: var(--color-paper); padding: 1px 4px; border-radius: 3px;
}
.skim .coarse {
  position: absolute; top: 6px; left: 7px;
  font-size: var(--text-2xs); color: var(--color-warn); pointer-events: none;
  background: var(--color-paper); padding: 1px 4px; border-radius: 3px;
}

/* Scrub bar with the take's marks on it. Marks live on the take, so every
   project built on it shows the same ticks. */
.bar { position: relative; height: 14px; background: var(--color-paper-2); }
.bar .pos { position: absolute; top: 0; bottom: 0; width: var(--rule); background: var(--color-ink); }
.bar .mk { position: absolute; top: 3px; width: 5px; height: 5px; margin-left: -2.5px; background: var(--color-accent); transform: rotate(45deg); }
.bar .done { position: absolute; top: 0; bottom: 0; left: 0; background: var(--color-accent-low); }

/* ── tile meta ────────────────────────────────────────────────────────────── */
.meta { padding: var(--space-2) var(--space-3) var(--space-3); display: flex; flex-direction: column; gap: 5px; }
.meta .top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); }
.meta .name { font-size: var(--text-base); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta .dur { color: var(--color-dim); font-variant-numeric: tabular-nums; font-size: var(--text-sm); }
.meta .sub { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-2xs); color: var(--color-faint); flex-wrap: wrap; }

.state { display: inline-flex; align-items: center; gap: 5px; letter-spacing: var(--track-label); text-transform: uppercase; }
.state i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.state.local  { color: var(--color-accent); } .state.local i  { background: var(--color-accent); }
.state.remote { color: var(--color-dim); }    .state.remote i { border: var(--rule) solid var(--color-dim); }
.state.both   { color: var(--color-ink); }    .state.both i   { background: var(--color-accent); box-shadow: 0 0 0 2px var(--color-paper-1), 0 0 0 3px var(--color-dim); }

/* ── actions — always visible, never hover-gated ──────────────────────────── */
.acts { display: flex; gap: var(--space-2); margin-top: 3px; flex-wrap: wrap; }
.act {
  appearance: none; -webkit-appearance: none;
  flex: 1; height: 34px; padding: 0 var(--space-2);
  border: var(--rule) solid var(--color-line-2); border-radius: var(--radius-sm);
  background: var(--color-paper-2); color: var(--color-ink);
  font: var(--text-2xs)/1 var(--font-ui); letter-spacing: var(--track-label); text-transform: uppercase;
  cursor: pointer; white-space: nowrap; touch-action: manipulation;
  transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.act:hover, .act.is-hover { background: var(--color-paper-3); border-color: var(--color-line-3); }
.act:focus-visible, .act.is-focus { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.act:active, .act.is-active { background: var(--color-paper-1); }
.act:disabled { color: var(--color-faint); background: var(--color-paper-1); border-color: var(--color-line); cursor: not-allowed; }
.act.primary { border-color: var(--color-accent); color: var(--color-accent); background: var(--color-accent-low); }
.act.primary:hover { background: var(--color-accent); color: var(--color-on-accent); }
.act.danger { flex: 0 0 auto; padding: 0 var(--space-3); border-color: var(--color-line-2); color: var(--color-dim); }
.act.danger:hover { border-color: var(--color-rec); color: var(--color-rec); background: var(--color-rec-low); }

/* ── confirm ──────────────────────────────────────────────────────────────
   Deleting the last copy of a take is the one action in this tool that cannot
   be undone, and the tool's whole premise is keeping the raw footage. So it
   gets a real confirm rather than an optimistic delete plus an Undo toast.
   Reclaiming a node copy that is already downloaded is a different action with
   a different weight, and says so. */
dialog {
  border: var(--rule) solid var(--color-line-2); border-radius: var(--radius-lg);
  background: var(--color-paper-1); color: var(--color-ink);
  padding: var(--space-5); max-width: 380px; width: calc(100% - 32px);
  font: var(--text-base)/1.5 var(--font-ui);
}
dialog::backdrop { background: var(--color-scrim); }
dialog h2 { margin: 0 0 var(--space-3); font-size: var(--text-md); font-weight: 600; letter-spacing: var(--track-label); text-transform: uppercase; }
dialog p { margin: 0 0 var(--space-3); color: var(--color-dim); font-size: var(--text-sm); }
dialog p b { color: var(--color-ink); font-weight: 500; }
dialog .warnline { color: var(--color-warn); }
dialog .row { display: flex; gap: var(--space-2); margin-top: var(--space-4); }
dialog .row .act { height: 42px; font-size: var(--text-xs); }
dialog .row .act.confirm { border-color: var(--color-rec); color: var(--color-rec); background: var(--color-rec-low); }
dialog .row .act.confirm:hover { background: var(--color-rec); color: var(--color-on-rec); }

.empty { padding: var(--space-6); color: var(--color-faint); grid-column: 1 / -1; }

@media (max-width: 560px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .where { margin-left: 0; width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}
</style>
</head>
<body>

<header class="head">
  <h1>Library</h1>
  <div class="sum"><b>6</b> takes · <b>19:02</b></div>
  <div class="where"><span class="dot"></span>on <b>mac</b> · node <b>pi-01</b> linked · reconciled by hash</div>
</header>

<div class="tabs">
  <button class="tab" type="button" aria-pressed="true">all 6</button>
  <button class="tab" type="button" aria-pressed="false">local 3</button>
  <button class="tab" type="button" aria-pressed="false">node only 2</button>
  <button class="tab" type="button" aria-pressed="false">both 1</button>
</div>

<main class="grid" id="grid" aria-label="Takes"></main>

<dialog id="confirm">
  <h2 id="cTitle">Delete take</h2>
  <p id="cBody"></p>
  <p class="warnline" id="cWarn"></p>
  <div class="row">
    <button class="act" type="button" id="cCancel">Cancel</button>
    <button class="act confirm" type="button" id="cGo">Delete</button>
  </div>
</dialog>

<script>
// Deterministic — fixed seed per take, never Math.random, so a take always
// skims to the same frames and two screenshots stay comparable.
const rng = (s) => () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const TAKES = [
  { id: 'take-014', hash: '4b1e9c07', dur: 252, marks: [0.09, 0.31, 0.58, 0.83], state: 'remote', size: '3.7 GB' },
  { id: 'take-013', hash: '9d3708af', dur: 158, marks: [0.22, 0.67],             state: 'both',   size: '2.3 GB' },
  { id: 'take-012', hash: '61c7d240', dur: 380, marks: [0.44],                   state: 'remote', size: '5.5 GB' },
  { id: 'take-011', hash: 'a05e4f19', dur: 67,  marks: [0.14, 0.52, 0.78],       state: 'local',  size: '0.98 GB' },
  { id: 'take-010', hash: '2f88b6ce', dur: 225, marks: [0.06, 0.2, 0.38, 0.55, 0.71, 0.9], state: 'local', size: '3.3 GB' },
  { id: 'take-009', hash: 'c714e0b8', dur: 48,  marks: [],                       state: 'local',  size: '0.70 GB' },
];

const mmss = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.round(s % 60)).padStart(2, '0');

// One depth shell, reused per tile and moved as a function of the skim position
// so scrubbing visibly changes the picture rather than only the readout.
function shell(seed) {
  const rand = rng(seed), pts = [];
  for (let i = 0; i < 900; i++) pts.push([(rand() - 0.5) * 4.0, -1.05 + rand() * 0.02, 1.2 + rand() * 4.0, 0]);
  const seg = [[0, -0.02, 0.19, 0.30, 260], [0, 0.46, 0.12, 0.13, 120],
               [-0.28, -0.04, 0.065, 0.28, 90], [0.29, -0.10, 0.065, 0.28, 90],
               [-0.12, -0.66, 0.085, 0.38, 130], [0.12, -0.66, 0.085, 0.38, 130]];
  for (const [cx, cy, rx, ry, n] of seg)
    for (let i = 0; i < n; i++) {
      const a = rand() * Math.PI * 2;
      pts.push([cx + Math.cos(a) * rx * (0.72 + rand() * 0.28), cy + (rand() - 0.5) * 2 * ry, -Math.sin(a) * rx * 0.85, 1]);
    }
  return pts;
}

// remote takes are browsed through the same decimation parameter the monitor
// negotiates — about 21ms a position over that 3.8 MB/s link against the 2.7ms
// a local take costs. Drawing them at full density would promise a smoothness
// the architecture does not have, so they genuinely skim coarser.
const DECIMATE = { local: 1, both: 1, remote: 3 };

function renderFrame(cv, take, t) {
  const r = Math.min(devicePixelRatio || 1, 2);
  const w = cv.parentElement.clientWidth;
  if (!w) return;
  const h = Math.round(w * 9 / 16);
  cv.style.height = h + 'px';
  if (cv.width !== Math.round(w * r) || cv.height !== Math.round(h * r)) {
    cv.width = Math.round(w * r); cv.height = Math.round(h * r);
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(r, 0, 0, r, 0, 0);
  ctx.fillStyle = css('--color-well'); ctx.fillRect(0, 0, w, h);

  const pts = take._pts || (take._pts = shell(parseInt(take.hash.slice(0, 6), 16)));
  const step = DECIMATE[take.state];
  // The subject walks across the room and turns as the take runs.
  const walk = Math.sin(t * Math.PI * 2 - 0.6) * 0.85;
  const depth = 2.42 + Math.cos(t * Math.PI * 2) * 0.5;
  const yaw = Math.sin(t * Math.PI * 3) * 0.5;
  const f = h * 1.30, ox = w / 2, oy = h * 0.38;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);

  for (let i = 0; i < pts.length; i += step) {
    const [px, py, pz, isBody] = pts[i];
    let X = px, Z = pz;
    if (isBody) { X = px * cy + pz * sy + walk; Z = -px * sy + pz * cy + depth; }
    if (Z < 0.4) continue;
    const sx = ox + (X * f) / Z, syy = oy - (py * f) / Z;
    if (sx < -3 || sx > w + 3 || syy < -3 || syy > h + 3) continue;
    ctx.globalAlpha = isBody ? 0.55 + 0.4 * Math.max(0, (4 - Z) / 4) : 0.10 + 0.16 * Math.max(0, (4 - Z) / 4);
    ctx.fillStyle = isBody ? css('--color-ink') : css('--color-faint');
    const s = step > 1 ? 1.8 : 1.3;
    ctx.fillRect(sx, syy, s, s);
  }
  ctx.globalAlpha = 1;
}

// ── build the gallery
const grid = document.getElementById('grid');
for (const take of TAKES) {
  const tile = document.createElement('article');
  tile.className = 'tile';
  const remote = take.state === 'remote';
  const onlyCopy = take.state !== 'both';

  tile.innerHTML = `
    <div class="skim" data-id="${take.id}">
      <canvas></canvas>
      <span class="t">00:00</span>
      ${remote ? '<span class="coarse">decimated · 21 ms/pos</span>' : ''}
    </div>
    <div class="bar">
      <span class="done" style="inline-size:0"></span>
      <span class="pos" style="left:0"></span>
      ${take.marks.map((m) => `<span class="mk" style="left:${m * 100}%"></span>`).join('')}
    </div>
    <div class="meta">
      <div class="top"><span class="name">${take.id}</span><span class="dur">${mmss(take.dur)}</span></div>
      <div class="sub">
        <span class="state ${take.state}"><i></i>${take.state === 'remote' ? 'node' : take.state}</span>
        <span>${take.size}</span>
        <span>${take.marks.length ? take.marks.length + (take.marks.length === 1 ? ' mark' : ' marks') : 'no marks'}</span>
        <span>sha256:${take.hash}…</span>
      </div>
      <div class="acts">
        ${remote
          ? '<button class="act primary" type="button">Download</button>'
          : '<button class="act primary" type="button">Open</button>'}
        ${take.state === 'both' ? '<button class="act" type="button" data-reclaim>Reclaim</button>' : ''}
        <button class="act danger" type="button" data-delete aria-label="Delete ${take.id}">Delete</button>
      </div>
    </div>`;
  grid.appendChild(tile);

  const cv = tile.querySelector('canvas');
  const bar = tile.querySelector('.bar');
  const pos = tile.querySelector('.pos');
  const done = tile.querySelector('.done');
  const tLabel = tile.querySelector('.t');
  const skim = tile.querySelector('.skim');
  let t = 0;

  const setT = (nt) => {
    t = Math.max(0, Math.min(1, nt));
    // Written straight from the pointer. Skimming is direct manipulation, so
    // there is no transition on the position line and none on the frame.
    pos.style.left = (t * 100) + '%';
    done.style.inlineSize = (t * 100) + '%';
    tLabel.textContent = mmss(t * take.dur);
    renderFrame(cv, take, t);
  };

  const fromX = (clientX) => {
    const r = skim.getBoundingClientRect();
    setT((clientX - r.left) / r.width);
  };
  skim.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons) fromX(e.clientX); });
  skim.addEventListener('pointerdown', (e) => { skim.setPointerCapture(e.pointerId); fromX(e.clientX); });
  skim.addEventListener('pointerleave', () => setT(0));
  bar.addEventListener('pointerdown', (e) => fromX(e.clientX));

  requestAnimationFrame(() => setT(0));

  tile.querySelector('[data-delete]').addEventListener('click', () => askDelete(take, onlyCopy));
  const rec = tile.querySelector('[data-reclaim]');
  if (rec) rec.addEventListener('click', () => askReclaim(take));
}

// A window resize is not the only thing that changes a tile's width - the grid
// reflows on its own as columns are added or dropped - so observe the tiles.
const ro = new ResizeObserver((entries) => {
  for (const e of entries) {
    const cv = e.target.querySelector('canvas');
    const id = e.target.dataset.id;
    if (cv) renderFrame(cv, TAKES.find((k) => k.id === id), 0);
  }
});
for (const el of document.querySelectorAll('.skim')) ro.observe(el);

// ── confirm
const dlg = document.getElementById('confirm');
document.getElementById('cCancel').addEventListener('click', () => dlg.close());
document.getElementById('cGo').addEventListener('click', () => dlg.close());

function askDelete(take, onlyCopy) {
  document.getElementById('cTitle').textContent = 'Delete take';
  document.getElementById('cBody').innerHTML =
    `<b>${take.id}</b> · ${mmss(take.dur)} · ${take.size}` +
    (take.marks.length ? ` · ${take.marks.length} marks` : '') +
    `<br>on ${take.state === 'remote' ? 'pi-01' : take.state === 'both' ? 'this Mac and pi-01' : 'this Mac'}.`;
  document.getElementById('cWarn').textContent = onlyCopy
    ? 'This is the only copy. Deleting it cannot be undone, and any project built on it loses its footage.'
    : '';
  document.getElementById('cGo').textContent = 'Delete';
  dlg.showModal();
}

function askReclaim(take) {
  document.getElementById('cTitle').textContent = 'Reclaim on node';
  document.getElementById('cBody').innerHTML =
    `Free <b>${take.size}</b> on pi-01 by removing its copy of <b>${take.id}</b>. ` +
    `The downloaded copy on this Mac is hash-verified and stays.`;
  document.getElementById('cWarn').textContent = '';
  document.getElementById('cGo').textContent = 'Reclaim';
  dlg.showModal();
}
</script>
</body>
</html>
